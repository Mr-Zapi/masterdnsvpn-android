plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing config is read from android/keystore.properties (kept out of
// git). If the file is absent, release builds stay unsigned so debug still works.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.masterdnsvpn.client'
    compileSdk 35

    defaultConfig {
        applicationId "com.masterdnsvpn.client"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // mobile.aar produced by ../../scripts/build-android-aar.sh (gomobile bind)
    implementation(name: 'mobile', ext: 'aar')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
